<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Anca — style options</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.top{display:flex;justify-content:space-between;align-items:center;padding:28px 48px}
.brand{font-family:"Cormorant Garamond",serif;font-size:28px;letter-spacing:.02em}
.brand small{font:300 11px Inter,sans-serif;letter-spacing:.3em;text-transform:uppercase;margin-left:12px;opacity:.6}
.top nav{display:flex;gap:32px;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.top nav a{opacity:.7}.top nav a:hover{opacity:1}
.intro{display:none}
.feature{display:none;position:relative}
.grid{display:grid;padding:0 48px 80px}
.card{position:relative;display:block;cursor:pointer}
.card .im{overflow:hidden}
.card img{transition:transform .8s}
.card:hover img{transform:scale(1.04)}
.card h3{margin:0;font-weight:400}
footer{padding:40px 48px;font-size:12px;opacity:.5;letter-spacing:.1em;text-transform:uppercase}

/* A — Gallery: light, uniform grid, titles below (Kordan-like) */
body.a{background:#f6f5f2;color:#222}
.a .grid{grid-template-columns:repeat(3,1fr);gap:48px 32px;max-width:1300px;margin:0 auto}
.a .card .im{aspect-ratio:5/4}
.a .card h3{font-family:"Cormorant Garamond",serif;font-size:24px;margin-top:14px}
.a .card small{font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:.5}
.a .intro{display:block;text-align:center;padding:40px 0 56px}
.a .intro h1{font:400 56px/1 "Cormorant Garamond",serif;margin:0 0 10px}
.a .intro p{margin:0;opacity:.6;letter-spacing:.2em;text-transform:uppercase;font-size:12px}

/* B — Minimal white: lots of air, no text on the grid until hover */
body.b{background:#fff;color:#111}
.b .brand{font:500 14px Inter,sans-serif;letter-spacing:.35em;text-transform:uppercase}
.b .brand small{display:none}
.b .intro{display:block;padding:70px 48px 70px;max-width:1300px;margin:0 auto}
.b .intro h1{font:300 64px/1.05 Inter,sans-serif;letter-spacing:-.03em;margin:0 0 14px}
.b .intro p{margin:0;color:#888;font-size:16px}
.b .grid{grid-template-columns:repeat(3,1fr);gap:8px;padding:0 8px 80px}
.b .card .im{aspect-ratio:1}
.b .card .t{position:absolute;inset:auto 0 0 0;padding:18px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .3s}
.b .card:hover .t{opacity:1}
.b .card h3{font-size:15px;font-weight:500}
.b .card small{font-size:12px;opacity:.8}

/* C — Dark cinematic: full-screen opening photo, big images, titles on the photos */
body.c{background:#0f0f0f;color:#eee}
.c .top{position:absolute;left:0;right:0;z-index:5;color:#fff}
.c .feature{display:block;height:100vh}
.c .feature::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 30%,transparent 55%,rgba(0,0,0,.75))}
.c .feature .cap{position:absolute;left:48px;bottom:56px;z-index:2;color:#fff}
.c .feature .cap span{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.75}
.c .feature .cap h1{font:400 84px/1 "Cormorant Garamond",serif;margin:10px 0 0}
.c .grid{grid-template-columns:repeat(2,1fr);gap:6px;padding:6px 6px 80px}
.c .card .im{aspect-ratio:4/5}
.c .card .t{position:absolute;left:28px;bottom:24px;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.c .card h3{font:400 40px/1.05 "Cormorant Garamond",serif}
.c .card small{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.c .card .im::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.6))}


/* F — Story: one album per row, big photo + title, alternating sides (McCurry-like travel storytelling) */
body.f{background:#fff;color:#151515}
.f .intro{display:block;max-width:1200px;margin:0 auto;padding:60px 48px 80px}
.f .intro h1{font:400 72px/1 "Cormorant Garamond",serif;margin:0 0 14px}
.f .intro p{margin:0;color:#777;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.f .grid{grid-template-columns:1fr;gap:110px;max-width:1200px;margin:0 auto}
.f .card{display:grid;grid-template-columns:1.5fr 1fr;gap:64px;align-items:center}
.f .card:nth-child(even) .im{order:2}
.f .card .im{aspect-ratio:4/3}
.f .card h3{font:400 52px/1.05 "Cormorant Garamond",serif;margin-bottom:12px}
.f .card small{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#888}
.f .card .t::after{content:"View the story →";display:block;margin-top:28px;font-size:14px;border-bottom:1px solid #151515;width:max-content;padding-bottom:4px}

/* G — Filmstrip: tall photos in one sideways-scrolling row (fashion / fine-art sites) */
body.g{background:#ebe7e1;color:#1c1c1c}
.g .top{justify-content:center;flex-direction:column;gap:14px;padding-top:40px}
.g .intro{display:block;text-align:center;padding:10px 0 36px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#888}
.g .intro h1{display:none}
.g .grid{display:flex;overflow-x:auto;gap:18px;padding:0 48px 30px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.g .grid{scroll-padding-left:48px}
.g .card{flex:0 0 calc(64vh * .75);scroll-snap-align:start}
.g .card .im{height:64vh}
.g .card h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:14px;font-weight:500}
.g .card small{font-size:11px;color:#888}

/* H — Journal: every photo on one wall, filter by album (Kordan categories + travel-journal feel) */
body.h{background:#f8f5ef;color:#24291f}
.h .intro{display:block;max-width:1300px;margin:0 auto;padding:50px 48px 30px}
.h .intro h1{font:italic 400 64px/1.05 "Cormorant Garamond",serif;margin:0 0 12px;max-width:820px}
.h .intro p{margin:0;color:#6f7466}
.h .grid{display:none}
.chips,.wall{display:none}
.h .chips{display:flex;flex-wrap:wrap;gap:8px;max-width:1300px;margin:0 auto;padding:10px 48px 30px}
.chips button{border:1px solid #c9c7bb;background:none;border-radius:999px;padding:8px 16px;font:13px Inter,sans-serif;color:#24291f;cursor:pointer}
.chips button.on,.chips button:hover{background:#3d4a3a;border-color:#3d4a3a;color:#fff}
.h .wall{display:block;columns:4 240px;column-gap:14px;max-width:1300px;margin:0 auto;padding:0 48px 80px}
.wall img{height:auto;margin:0 0 14px;break-inside:avoid;border-radius:4px}

/* style switcher (preview only) */
.switch{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:99;display:flex;max-width:96vw;overflow-x:auto;white-space:nowrap;gap:6px;background:#fff;padding:6px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);font:500 13px Inter,sans-serif}
.switch button{border:0;background:none;padding:10px 18px;border-radius:999px;cursor:pointer;color:#222;font:inherit}
.switch button.on{background:#222;color:#fff}
@media (max-width:800px){.f .card{grid-template-columns:1fr;gap:20px}.f .card:nth-child(even) .im{order:0}.f .card h3{font-size:36px}.h .wall{padding:0 16px 80px}.h .chips{padding:10px 16px 24px}.h .intro h1,.f .intro h1{font-size:40px}.top{padding:20px}.top nav{gap:16px;font-size:11px}.grid{padding-left:16px;padding-right:16px}.a .grid,.b .grid{grid-template-columns:repeat(2,1fr);gap:20px 12px}.c .grid{grid-template-columns:1fr}.c .feature .cap{left:20px}.c .feature .cap h1{font-size:48px}.b .intro h1,.a .intro h1{font-size:40px}}
</style>
</head>
<body class="a">
<header class="top"><a class="brand" href="#">Anca<small>Photography</small></a><nav><a href="#grid">Albums</a><a href="#">About</a><a href="#">Contact</a></nav></header>
<section class="feature"><img id="feat" alt=""/><div class="cap"><span>Latest album</span><h1 id="featTitle"></h1></div></section>
<div class="intro"><h1>Anca's Photography</h1><p>Travel · Portraits · Everyday places</p></div>
<main class="grid" id="grid"></main>
<div class="chips" id="chips"></div><div class="wall" id="wall"></div>
<footer>© 2026 Anca Photography</footer>
<div class="switch"><button data-s="a" class="on">A · Gallery</button><button data-s="b">B · Minimal</button><button data-s="c">C · Dark</button><button onclick="location.href='mockup.html'">D · Warm</button><button onclick="location.href='mockup.html?even'">E · Warm even</button><button data-s="f">F · Story</button><button data-s="g">G · Filmstrip</button><button data-s="h">H · Journal</button></div>
<script>
// Style preview: same live album data, three looks. Read-only.
const RAW = 'https://raw.githubusercontent.com/Vladdstian/vladdstian.github.io/main/';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch(RAW + '_data.json').then(r => r.json()).then(d => {
  const albums = d.collections.filter(c => c.photos.length);
  document.getElementById('grid').innerHTML = albums.map(c => `
    <a class="card"><div class="im"><img loading="lazy" src="${esc(c.cover || c.photos[0].url)}" alt="${esc(c.name)}"/></div>
    <div class="t"><h3>${esc(c.name)}</h3><small>${c.photos.length} photos</small></div></a>`).join('');
  const f = albums[0];
  document.getElementById('feat').src = f.photos[3] ? f.photos[3].url : f.cover;
  document.getElementById('featTitle').textContent = f.name;
  // H: one wall of every photo, filterable by album
  const all = albums.flatMap(c => c.photos.map(p => ({ ...p, album: c.slug })));
  const wall = document.getElementById('wall'), chips = document.getElementById('chips');
  const show = slug => {
    wall.innerHTML = all.filter(p => !slug || p.album === slug).map(p => `<img loading="lazy" src="${esc(p.url)}" ${p.w ? `width="${p.w}" height="${p.h}"` : ''} alt=""/>`).join('');
    chips.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.a === (slug || '')));
  };
  chips.innerHTML = `<button data-a="">All · ${all.length}</button>` + albums.map(c => `<button data-a="${esc(c.slug)}">${esc(c.name)}</button>`).join('');
  chips.onclick = e => { if (e.target.dataset.a !== undefined) show(e.target.dataset.a); };
  show('');
});
const pick = s => { document.body.className = s; document.querySelectorAll('.switch button').forEach(b => b.classList.toggle('on', b.dataset.s === s)); history.replaceState(null, '', '#' + s); };
document.querySelectorAll('.switch button[data-s]').forEach(b => b.onclick = () => pick(b.dataset.s));
if (['a','b','c','f','g','h'].includes(location.hash.slice(1))) pick(location.hash.slice(1));
</script>
</body>
</html>
